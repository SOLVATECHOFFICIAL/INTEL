<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1A2E" />
    <title>Offline — LASUED Intel</title>
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f8fafc;
        color: #0b1a2e;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 440px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(11, 26, 46, 0.06);
      }
      .brand {
        width: 68px;
        height: 68px;
        border-radius: 16px;
        object-fit: cover;
        border: 1px solid #e2e8f0;
      }
      h1 {
        margin: 18px 0 8px;
        font-size: 22px;
        line-height: 1.25;
        font-weight: 700;
      }
      p {
        margin: 0 0 22px;
        font-size: 14px;
        line-height: 1.55;
        color: #475569;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }
      button,
      a {
        appearance: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      .primary {
        border: 0;
        background: #1e88e5;
        color: #ffffff;
      }
      .secondary {
        border: 1px solid #cbd5e1;
        background: #ffffff;
        color: #0b1a2e;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img
        src="/pwa-192x192.png"
        alt="LASUED Intel logo"
        class="brand"
        width="68"
        height="68"
      />
      <h1>You&rsquo;re offline</h1>
      <p>
        LASUED Intel couldn&rsquo;t reach the network for this page right now.
        Previously cached campus feeds remain available once you reopen the app
        or reconnect.
      </p>
      <div class="actions">
        <button type="button" class="primary" onclick="window.location.reload()">
          Retry Connection
        </button>
        <a href="/" class="secondary">Open Cached Home</a>
      </div>
    </main>
  </body>
</html>
